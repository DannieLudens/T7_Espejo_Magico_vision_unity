<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Espejo Mágico — Tour Telemedellín</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
      #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: #0a0a0a; outline: none; }
      #loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, 60vw); text-align: center;
                 font-family: 'Quicksand', sans-serif; color: rgba(240, 230, 200, 0.55); letter-spacing: 0.08em; font-size: 13px; }
      #loading-track { margin-top: 14px; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
      #loading-bar { width: 0%; height: 100%; background: #d4af37; transition: width 0.2s; }
    </style>
    <!-- Same MediaPipe solutions as the web kiosk (index.html) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/face_mesh.js" crossorigin="anonymous"></script>
    <script src="TemplateData/espejo-bridge.js"></script>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">CARGANDO ESPEJO MÁGICO<div id="loading-track"><div id="loading-bar"></div></div></div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector('#unity-canvas');
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, function (progress) {
        document.getElementById('loading-bar').style.width = Math.round(progress * 100) + '%';
      }).then(function (unityInstance) {
        document.getElementById('loading').remove();
        canvas.focus();                                   // operator keys (V, G, C, `) reach Unity
        window.unityInstance = unityInstance;
      }).catch(function (message) {
        document.getElementById('loading').textContent = message;
      });
    </script>
  </body>
</html>
